version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: studyflow-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: studyflow
      MONGO_INITDB_ROOT_PASSWORD: studyflow
      MONGO_INITDB_DATABASE: studyflow
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  mailpit:
    image: axllent/mailpit:latest
    container_name: studyflow-mailpit
    restart: always
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data

volumes:
  mongodb_data:
  mailpit_data:
